# Publishes erp-frontend/ to GitHub Pages on every push to main.
# Same shape as ABPS-Solution/Portal's deploy-frontend.yml — see that
# repo if this ever needs changing, keep both in sync.
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'erp-frontend/**'
      - '.github/workflows/deploy-frontend.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need the previous commit to diff CACHE_VERSION

      # The service worker caches JS cache-first, so a deploy that changes a
      # script WITHOUT bumping CACHE_VERSION leaves users on fresh HTML with
      # stale JS — the exact stale-deploy bug the no-cache meta tags were
      # added for, which a service worker makes inert. Fail loudly here
      # rather than discover it in production. Same guard as Portal's own
      # deploy-frontend.yml; keep both in sync.
      - name: Require a CACHE_VERSION bump when frontend files change
        run: |
          if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "No previous commit to compare against — skipping."; exit 0
          fi
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- erp-frontend/ \
                    | grep -v '^erp-frontend/sw.js$' || true)
          if [ -z "$CHANGED" ]; then
            echo "No erp-frontend changes (other than sw.js itself) — no bump required."; exit 0
          fi
          OLD=$(git show HEAD~1:erp-frontend/sw.js 2>/dev/null \
                | grep -oE "^const CACHE_VERSION = '[^']+'" || echo "none")
          NEW=$(grep -oE "^const CACHE_VERSION = '[^']+'" erp-frontend/sw.js)
          if [ "$OLD" = "none" ]; then
            echo "sw.js is new in this commit — nothing to compare."; exit 0
          fi
          if [ "$OLD" = "$NEW" ]; then
            echo "::error::erp-frontend changed but CACHE_VERSION in sw.js was not bumped."
            echo "Users would get fresh HTML against cached old JS. Bump it and push again."
            echo "Changed files:"; echo "$CHANGED"
            exit 1
          fi
          echo "CACHE_VERSION bumped ($OLD -> $NEW)."

      # Loads the site in a headless browser and fails the deploy on a script
      # that doesn't load, an uncaught JS error, or a button/field handler
      # that calls a function that doesn't exist.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Smoke-test the frontend in a headless browser
        run: |
          npm i --no-save --prefix /tmp/smoke playwright@1
          /tmp/smoke/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/smoke/node_modules node .github/scripts/smoke-frontend.js erp-frontend

      - uses: actions/configure-pages@v5
      - name: Upload erp-frontend as the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: erp-frontend
      - id: deployment
        uses: actions/deploy-pages@v4
